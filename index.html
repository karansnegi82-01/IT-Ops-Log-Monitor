<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Ops Server Log & Incident Monitor</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; margin: 0; color: #38bdf8; }
        
        
        .alert-box { padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; display: none; }
        .alert-danger { background-color: #7f1d1d; border: 1px solid #ef4444; color: #fecaca; display: block; }
        .alert-ok { background-color: #064e3b; border: 1px solid #10b981; color: #a7f3d0; display: block; }

        
        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
        .card h3 { margin: 0; font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; }
        .card p { margin: 10px 0 0; font-size: 1.8rem; font-weight: bold; }
        .info-num { color: #38bdf8; }
        .warn-num { color: #facc15; }
        .err-num { color: #f87171; }

        
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; }
        button, label.upload-btn { padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; background: #2563eb; color: white; font-size: 0.9rem; }
        button:hover, label.upload-btn:hover { background: #1d4ed8; }
        button.btn-danger { background: #dc2626; }
        button.btn-export { background: #059669; }
        input[type="file"] { display: none; }

        
        .log-box { background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 15px; height: 320px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.9rem; }
        .log-line { padding: 6px 8px; border-bottom: 1px solid #1e293b; }
        .log-ERROR { color: #f87171; background: rgba(239, 68, 68, 0.1); }
        .log-WARNING { color: #facc15; }
        .log-INFO { color: #4ade80; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>IT Ops Log & Incident Monitor</h1>
        <div>
            <label for="fileInput" class="upload-btn">Upload .txt/.log File</label>
            <input type="file" id="fileInput" accept=".txt,.log">
            <button class="btn-export" onclick="exportReport()">Export Incident Report</button>
        </div>
    </header>

    <div id="alertBanner" class="alert-box"></div>

    <div class="cards">
        <div class="card"><h3>Total Scanned</h3><p id="totalCount">0</p></div>
        <div class="card"><h3>INFO Logs</h3><p id="infoCount" class="info-num">0</p></div>
        <div class="card"><h3>WARNINGS</h3><p id="warnCount" class="warn-num">0</p></div>
        <div class="card"><h3>CRITICAL ERRORS</h3><p id="errCount" class="err-num">0</p></div>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search logs (e.g., Database, RAM, 10:05)..." onkeyup="filterLogs()">
        <button onclick="setSeverityFilter('ALL')">All</button>
        <button class="btn-danger" onclick="setSeverityFilter('ERROR')">Errors Only</button>
        <button onclick="setSeverityFilter('WARNING')">Warnings</button>
    </div>

    <div class="log-box" id="logContainer"></div>
</div>

<script>
    
    let rawLogs = [
        "2026-11-11 09:15:02 INFO Server boot sequence completed",
        "2026-11-11 09:22:18 INFO User session initialized for ID_402",
        "2026-11-11 09:40:55 WARNING CPU temperature reached 78C",
        "2026-11-11 10:05:11 ERROR Database connection timeout on port 5432",
        "2026-11-11 10:12:49 INFO Daily backup job started",
        "2026-11-11 10:19:30 WARNING High RAM usage detected (84%)",
        "2026-11-11 10:27:04 ERROR Authentication service failed to respond",
        "2026-11-11 10:33:19 ERROR Database connection timeout on port 5432",
        "2026-11-11 10:45:00 INFO Health check ping OK"
    ];

    let currentSeverity = 'ALL';
    let errorList = [];

    
    function analyzeLogs() {
        let counts = { INFO: 0, WARNING: 0, ERROR: 0 };
        errorList = [];

        rawLogs.forEach(line => {
            if (line.includes("ERROR")) {
                counts.ERROR++;
                errorList.push(line);
            } else if (line.includes("WARNING")) {
                counts.WARNING++;
            } else if (line.includes("INFO")) {
                counts.INFO++;
            }
        });

        document.getElementById("totalCount").innerText = rawLogs.length;
        document.getElementById("infoCount").innerText = counts.INFO;
        document.getElementById("warnCount").innerText = counts.WARNING;
        document.getElementById("errCount").innerText = counts.ERROR;

        const banner = document.getElementById("alertBanner");
        if (counts.ERROR >= 3) {
            banner.className = "alert-box alert-danger";
            banner.innerText = "[P1 INCIDENT TRIGGERED] Critical error threshold breached (" + counts.ERROR + " errors). Escalate to L2 Support.";
        } else {
            banner.className = "alert-box alert-ok";
            banner.innerText = "[SYSTEM HEALTHY] Server operating within normal error thresholds.";
        }

        filterLogs();
    }

    
    function filterLogs() {
        const keyword = document.getElementById("searchInput").value.toLowerCase();
        const container = document.getElementById("logContainer");
        container.innerHTML = "";

        rawLogs.forEach(line => {
            const matchesSeverity = (currentSeverity === 'ALL') || line.includes(currentSeverity);
            const matchesKeyword = line.toLowerCase().includes(keyword);

            if (matchesSeverity && matchesKeyword) {
                const div = document.createElement("div");
                div.className = "log-line";
                if (line.includes("ERROR")) div.classList.add("log-ERROR");
                else if (line.includes("WARNING")) div.classList.add("log-WARNING");
                else div.classList.add("log-INFO");

                div.innerText = line;
                container.appendChild(div);
            }
        });
    }

    function setSeverityFilter(level) {
        currentSeverity = level;
        filterLogs();
    }

    
    document.getElementById("fileInput").addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            rawLogs = event.target.result
                .replace(/\s+(?=\d{4}-\d{2}-\d{2})/g, "\n")
                .split(/\r?\n/)
                .filter(line => line.trim() !== "");
            analyzeLogs();
        };
        reader.readAsText(file);
    });

    
    function exportReport() {
        let content = "=== AUTOMATED INCIDENT REPORT ===\n";
        content += "Total Critical Errors: " + errorList.length + "\n\n";
        errorList.forEach(err => content += "- " + err + "\n");

        const blob = new Blob([content], { type: "text/plain" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "incident_report.txt";
        link.click();
    }

    
    analyzeLogs();
</script>
</body>
</html>
